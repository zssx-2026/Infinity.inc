<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载前验证 · Infinity.Inc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a3d 0%, #0e1116 60%);
    color: #e6edf3; font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .brand { font-size: 13px; letter-spacing: .18em; color: #7d8b9a; text-transform: uppercase; }
  h1 { font-size: 22px; font-weight: 600; margin: 10px 0 6px; }
  .sub { color: #9aa7b4; margin: 0 0 22px; min-height: 22px; font-size: 14px; }
  .card { background: #141a21; border: 1px solid #232c37; border-radius: 12px; padding: 18px; }
  #ts { display: flex; justify-content: center; min-height: 66px; }
  #local { display: none; }
  #local.on { display: block; }
  #code { display: block; margin: 0 auto 12px; border-radius: 8px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b3644;
    background: #0e1116; color: #e6edf3; font: 16px/1.2 Consolas, monospace;
    letter-spacing: .28em; text-align: center; text-transform: uppercase;
  }
  input:focus { outline: none; border-color: #1f6feb; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; background: #1f6feb; color: #fff; border: 0; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: #1b2430; color: #b8c4d0; }
  button:hover { filter: brightness(1.1); }
  button[disabled] { opacity: .55; cursor: default; }
  .hint { color: #6f7c8a; font-size: 12.5px; margin: 14px 0 0; min-height: 18px; }
  .err { color: #ff9a9a; }
  footer { margin-top: 26px; color: #4f5a67; font-size: 12px; }
  a { color: #5b9bff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="brand">Infinity.Inc</div>
  <h1>下载前验证</h1>
  <p class="sub" id="sub">正在确认安装包…</p>
  <div class="card">
    <div id="ts"></div>
    <div id="local">
      <img id="code" alt="验证码" width="200" height="64">
      <input id="ans" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="6" placeholder="输入图中字符">
      <div class="row">
        <button id="ok">确认并下载</button>
        <button id="refresh" class="ghost">换一张</button>
      </div>
    </div>
    <p class="hint" id="hint">这一步由 Cloudflare Turnstile 确认，通过后自动跳转到下载。</p>
  </div>
  <footer>验证与下载由 Cloudflare 提供 · <a href="https://infinity-studio-craft.github.io/">返回首页</a></footer>
</main>
<script>
(function () {
  var SITEKEY = '0x4AAAAAAF-CBPThfL7uy0hi';
  var GATE = 'https://infinity-downloads.pages.dev';
  var ALLOW = ['InfinityStudio-setup', 'InfinityServer-setup'];
  var q = new URLSearchParams(location.search);
  var asset = q.get('asset') || '';
  if (ALLOW.indexOf(asset) < 0) asset = 'InfinityStudio-setup';

  var sub = document.getElementById('sub');
  var hint = document.getElementById('hint');
  var tsBox = document.getElementById('ts');
  var localBox = document.getElementById('local');
  var codeImg = document.getElementById('code');
  var ans = document.getElementById('ans');
  var okBtn = document.getElementById('ok');
  var refreshBtn = document.getElementById('refresh');
  var widgetId = null;
  var challenge = '';
  var busy = false;

  function human(n) {
    if (!n || n < 0) return '';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
  }

  fetch(GATE + '/api/catalog', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      var p = j && j.products ? j.products.filter(function (x) { return x.asset === asset; })[0] : null;
      if (p) {
        sub.textContent = p.name + ' ' + (p.version || '') + (p.size ? ' · ' + human(p.size) : '');
        document.title = '下载前验证 · ' + p.name;
      } else {
        sub.textContent = asset.replace(/-setup$/, '');
      }
    })
    .catch(function () { sub.textContent = asset.replace(/-setup$/, ''); });

  function goTurnstile(token) {
    hint.textContent = '验证通过，正在跳转到下载…';
    location.replace(GATE + '/dl/' + encodeURIComponent(asset) + '?token=' + encodeURIComponent(token));
  }

  function goLocal(ticket) {
    hint.textContent = '验证通过，正在跳转到下载…';
    location.replace(GATE + '/dl/' + encodeURIComponent(asset) + '?lt=' + encodeURIComponent(ticket));
  }

  /* ---- local fallback (works where the Turnstile challenge frame cannot load) ---- */
  function loadCode() {
    okBtn.disabled = true;
    fetch(GATE + '/api/verify', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.image || !j.challenge) throw new Error('bad challenge');
        challenge = j.challenge;
        codeImg.src = j.image;
        okBtn.disabled = false;
        ans.value = '';
        ans.focus();
      })
      .catch(function () {
        hint.textContent = '验证码加载失败，请刷新页面重试。';
      });
  }

  function useLocal(reason) {
    if (localBox.className === 'on') return;
    localBox.className = 'on';
    tsBox.style.display = 'none';
    hint.className = 'hint';
    hint.textContent = reason || '请输入图中的字符，然后点「确认并下载」。';
    loadCode();
  }

  okBtn.addEventListener('click', function () {
    if (busy) return;
    var answer = (ans.value || '').replace(/\s+/g, '');
    if (!answer) { ans.focus(); return; }
    busy = true;
    okBtn.disabled = true;
    hint.className = 'hint';
    hint.textContent = '正在校验…';
    fetch(GATE + '/api/verify', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ challenge: challenge, answer: answer, asset: asset })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        busy = false;
        okBtn.disabled = false;
        if (res.ok && res.j && res.j.ticket) { goLocal(res.j.ticket); return; }
        hint.className = 'hint err';
        hint.textContent = res.j && res.j.error === 'wrong_code' ? '字符不正确，请重试。' : '验证失败，请换一张再试。';
        loadCode();
      })
      .catch(function () {
        busy = false;
        okBtn.disabled = false;
        hint.className = 'hint err';
        hint.textContent = '网络异常，请重试。';
      });
  });

  ans.addEventListener('keydown', function (e) { if (e.key === 'Enter') okBtn.click(); });
  refreshBtn.addEventListener('click', loadCode);

  /* ---- Turnstile first; local fallback if it cannot run here ---- */
  window.onTurnstileReady = function () {
    if (!window.turnstile || widgetId !== null) return;
    widgetId = window.turnstile.render('#ts', {
      sitekey: SITEKEY,
      theme: 'dark',
      language: 'zh-cn',
      callback: goTurnstile,
      'error-callback': function () { useLocal('人机验证未能完成，请用下面的本地验证继续。'); },
      'expired-callback': function () { useLocal('验证已过期，请重新验证。'); }
    });
  };

  if (q.get('local') === '1') {
    useLocal();
  } else {
    var watchdog = setTimeout(function () {
      if (widgetId === null) useLocal('人机验证组件没能加载（网络受限），请用下面的本地验证继续。');
    }, 6000);
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileReady';
    s.async = true; s.defer = true;
    s.onerror = function () { clearTimeout(watchdog); useLocal('人机验证组件没能加载（网络受限），请用下面的本地验证继续。'); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
