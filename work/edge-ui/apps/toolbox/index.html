<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="#7a5af5">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Infinity 工具箱 · ITB</title>
<script>
(function(){try{var q=new URLSearchParams(location.search);var t=q.get('theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}
var l=q.get('locale');if(l){document.documentElement.lang=l;}}catch(e){}})();
</script>
<link rel="stylesheet" href="../../assets/css/apps.css" />
</head>
<body class="app-page">
<header class="ap-top">
  <div class="ap-brand">
    <span class="ap-logo">ITB</span>
    <div><strong>Infinity 工具箱</strong><small>Infinity Toolbox · ITB</small></div>
  </div>
  <nav class="ap-nav">
    <button type="button" class="active">全部工具</button>
    <button type="button">系统</button>
    <button type="button">网络</button>
    <button type="button">文件</button>
    <button type="button">脚本</button>
  </nav>
  <div class="ap-actions">
    <span class="tag ok">1.0.0-pre4</span>
    <button class="ap-btn" type="button">刷新</button>
    <button class="ap-btn primary" type="button">运行选中</button>
  </div>
</header>
<main class="ap-main">
  <div class="tiles">
    <button class="tile"><span class="t-ico">CL</span><span class="t-name">系统清理</span><span class="t-sub">清理临时文件与缓存，释放磁盘空间。</span></button>
    <button class="tile"><span class="t-ico">ST</span><span class="t-name">启动项管理</span><span class="t-sub">查看并禁用开机自启动条目。</span></button>
    <button class="tile"><span class="t-ico">NT</span><span class="t-name">网络诊断</span><span class="t-sub">连通性、DNS、丢包与路由追踪。</span></button>
    <button class="tile"><span class="t-ico">RN</span><span class="t-name">批量重命名</span><span class="t-sub">按规则重命名，支持正则与预览。</span></button>
    <button class="tile"><span class="t-ico">DV</span><span class="t-name">驱动备份</span><span class="t-sub">导出当前驱动，便于重装恢复。</span></button>
    <button class="tile"><span class="t-ico">SC</span><span class="t-name">快捷脚本</span><span class="t-sub">保存常用批处理与 PowerShell 片段。</span></button>
  </div>
  <div class="two-col">
    <div class="card">
      <h3>最近运行</h3>
      <table class="tbl">
        <tr><th>工具</th><th>开始时间</th><th>耗时</th><th>结果</th></tr>
        <tr><td>系统清理</td><td>今天 10:12</td><td>1.4 s</td><td>已释放 2.3 GB</td></tr>
        <tr><td>网络诊断</td><td>今天 09:58</td><td>6.2 s</td><td>延迟 21 ms</td></tr>
        <tr><td>驱动备份</td><td>昨天 18:30</td><td>24.8 s</td><td>已导出 86 项</td></tr>
      </table>
    </div>
    <div class="card"><h3>环境</h3>
      <div class="list">
        <div class="row"><div class="grow"><div class="name">PowerShell</div><div class="sub">7.4.6</div></div><span class="val">可用</span></div>
        <div class="row"><div class="grow"><div class="name">Windows</div><div class="sub">11 24H2 · x64</div></div><span class="val">就绪</span></div>
        <div class="row"><div class="grow"><div class="name">脚本沙箱</div><div class="sub">ConstrainedLanguage</div></div><span class="val">开启</span></div>
      </div>
    </div>
  </div>
  <p class="note">演示内容 · 由 Infinity Edge Shell 通过 &lt;iframe&gt; 加载（宿主模式下由精简 Chromium 直接承载）。</p>
</main>
</body>
</html>
