<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新标签页 · Infinity Edge Shell</title>
<!-- Locally rendered new tab page. No external resources, no network requests:
     hosts (WebView2 / CEF) may load this file directly for infinity://newtab or
     about:home; the shell also renders the same markup inline in index.html. -->
<style>
  :root { color-scheme: dark;
    --bg: #0a1020; --surface: rgba(42,45,51,.9); --field: rgba(60,64,72,.74);
    --text-1: #f4f5f7; --text-2: #c9cdd4; --text-3: #9aa1ab;
    --border: rgba(255,255,255,.1); --accent: #4cc2ff; --accent-strong: #0f6cbd;
    --font: "Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif; }
  html[data-theme="light"] { color-scheme: light;
    --bg: #eef2f8; --surface: rgba(255,255,255,.94); --field: rgba(255,255,255,.9);
    --text-1: #141619; --text-2: #3d4147; --text-3: #5f656d;
    --border: rgba(0,0,0,.12); --accent: #0f6cbd; --accent-strong: #0f6cbd; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); font-size: 13px; color: var(--text-1); background: var(--bg);
    background-image: radial-gradient(900px 520px at 12% -10%, rgba(47,123,214,.35), transparent 60%),
                      radial-gradient(760px 520px at 96% 12%, rgba(166,66,200,.28), transparent 62%);
    display: grid; place-items: start center; overflow: auto; }
  .wrap { width: min(1020px, 100%); padding: 64px 32px 32px; display: flex; flex-direction: column; gap: 26px; align-items: center; }
  .logo { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; color: #fff; font-size: 28px;
    background: linear-gradient(135deg,#0f6cbd,#7a5af5 55%,#1aa4a0); box-shadow: 0 10px 26px rgba(15,108,189,.35); }
  h1 { margin: 10px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .date { margin: 4px 0 0; color: var(--text-3); }
  .hint { margin: 2px 0 0; color: var(--text-3); font-size: 11.5px; opacity: .85; }
  form { display: flex; align-items: center; gap: 10px; width: min(720px, 100%); height: 48px; padding: 0 6px 0 16px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76,194,255,.16); }
  input[type="text"] { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text-1); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .go { height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--accent-strong); color: #fff; font-weight: 600; }
  .section { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .section h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }
  .tile { display: flex; gap: 12px; align-items: center; padding: 14px; text-align: left; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); transition: transform .16s cubic-bezier(.16,1,.3,1); }
  .tile:hover { transform: translateY(-2px); }
  .badge { width: 40px; height: 40px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff;
    font-weight: 800; font-size: 12px; background: linear-gradient(145deg, var(--c, #0f6cbd), #123); }
  .tile small { display: block; color: var(--text-3); margin-top: 3px; }
  footer { display: flex; gap: 10px; align-items: center; color: var(--text-3); font-size: 11.5px; }
  .pill { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <span class="logo">&#8734;</span>
  <h1 id="greeting">早上好</h1>
  <p class="date" id="date"></p>
  <p class="hint">本地渲染的新标签页 · 无固定主页 · 无外部网络请求</p>

  <form id="search" autocomplete="off">
    <input id="q" type="text" placeholder="搜索或输入 Web 地址" aria-label="Search" />
    <button class="go" type="submit">搜索</button>
  </form>

  <section class="section">
    <h2>Infinity 套件</h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer><span class="pill">infinity-shell/1</span><span>Chromium Trim · 本地新标签页（newtab.html）</span></footer>
</div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var theme = q.get("theme");
  if (theme !== "light" && theme !== "dark") {
    theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.dataset.theme = theme;

  var en = String(q.get("locale") || "zh-CN").toLowerCase().indexOf("en") === 0;
  var APPS = [
    { code: "INC", name: en ? "Infinity Cloud" : "Infinity 云", url: "inc://cloud", color: "#0f6cbd" },
    { code: "ITB", name: en ? "Infinity Toolbox" : "Infinity 工具箱", url: "inc://toolbox", color: "#7a5af5" },
    { code: "IIM", name: en ? "Infinity Installer" : "Infinity 安装管理器", url: "inc://installer", color: "#0f8a6a" },
    { code: "IFM", name: en ? "Infinity Files" : "Infinity 文件管理器", url: "inc://files", color: "#d97706" }
  ];
  var L = {
    zh: { morning: "早上好", afternoon: "下午好", evening: "晚上好", placeholder: "搜索或输入 Web 地址", search: "搜索", suite: "Infinity 套件" },
    en: { morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening", placeholder: "Search or enter a web address", search: "Search", suite: "Infinity suite" }
  };
  var s = en ? L.en : L.zh;
  var h = new Date().getHours();
  document.documentElement.lang = en ? "en-US" : "zh-CN";
  document.getElementById("greeting").textContent = h < 12 ? s.morning : (h < 18 ? s.afternoon : s.evening);
  document.getElementById("q").placeholder = s.placeholder;
  document.querySelector(".go").textContent = s.search;
  document.querySelector(".section h2").textContent = s.suite;
  try {
    document.getElementById("date").textContent = new Intl.DateTimeFormat(en ? "en-US" : "zh-CN",
      { year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(new Date());
  } catch (e) { document.getElementById("date").textContent = new Date().toLocaleDateString(); }

  var grid = document.getElementById("grid");
  APPS.forEach(function (a) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.innerHTML = '<span class="badge" style="--c:' + a.color + '">' + a.code + "</span>" +
                  "<span><strong>" + a.name + "</strong><small>" + a.url + "</small></span>";
    b.addEventListener("click", function () { navigate(a.url); });
    grid.appendChild(b);
  });

  /* The shell/host owns navigation: emit the same infinity-shell frame the
     inline NTP uses. Standalone (no host) it just reports the target. */
  function navigate(url) {
    var frame = { channel: "infinity-shell", v: 1, dir: "to-host", type: "shell.navigate",
      payload: { url: url, disposition: "current", source: "newtab.html" }, ts: Date.now() };
    try {
      if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(frame); }
      else if (window.parent && window.parent !== window) { window.parent.postMessage(frame, "*"); }
    } catch (e) { /* ignore */ }
    return frame;
  }
  document.getElementById("search").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = document.getElementById("q").value.trim();
    if (v) { navigate(v); }
  });
  window.__NEWTAB__ = { theme: theme, locale: en ? "en-US" : "zh-CN", apps: APPS, navigate: navigate,
    local: true, externalRequests: 0 };
})();
</script>
</body>
</html>
