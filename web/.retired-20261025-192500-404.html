<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- site-seo: hreflang + open graph -->
<meta name="description" content="That address does not match a page on this site.">
<link rel="canonical" href="https://zssx-2026.github.io/404.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Infinity.Inc">
<meta property="og:title" content="Not found — Infinity.Inc">
<meta property="og:description" content="That address does not match a page on this site.">
<meta property="og:url" content="https://zssx-2026.github.io/404.html">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Not found — Infinity.Inc">
<meta name="twitter:description" content="That address does not match a page on this site.">
<title>Not found — Infinity.Inc</title>
<meta name="robots" content="noindex">
<!--
  theme.js is loaded by an absolute path on purpose: this document is served for
  arbitrary paths (including the repository root), so a base derived from a
  script's own src would be wrong. The absolute path is where the suite keeps it.
-->
<script src="/infinity/assets/theme.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --ink: #e6e9f0; --ink-dim: #98a0b3; --accent: #4c8dff; }
  html[data-theme="light"] { color-scheme: light; --bg: #ffffff; --ink: #14171d; --ink-dim: #4d5566; --accent: #1f6feb; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 "Segoe UI", system-ui, -apple-system, "Noto Sans SC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: var(--ink-dim); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Not found</h1>
  <p id="what">That address does not match a page on this site.</p>
  <p><a href="https://zssx-2026.github.io/infinity/">Go to the Infinity.Inc site</a></p>
</main>

<script>
/*
 * This file is the repository's 404 handler.
 *
 * A missing address under the suite's directory belongs to the suite, and the
 * suite's pages are script routes - a static host cannot tell
 * /infinity/run/abc from a typo. The root /404 is a real page, so a request
 * for a missing suite page is sent there. The root page must never redirect
 * again: /404 is itself a missing path, and a redirect from it would loop.
 *
 * Deliberately standalone. It loads no site.js and no site.css, because it is
 * served for arbitrary paths - including the repository root, where a base
 * derived from a script's own src would be wrong.
 */
(function () {
  var path = location.pathname;
  if (path.indexOf('/infinity/') === 0 || path === '/infinity') {
    location.replace('https://zssx-2026.github.io/404');
    return;
  }
  var what = document.getElementById('what');
  if (what) what.textContent = path + ' does not match a page on this site.';
})();
</script>
</body>
</html>
