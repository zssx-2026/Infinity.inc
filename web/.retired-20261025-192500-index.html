<head>

<link rel="stylesheet" href="./infinity/assets/site.css">
  <link rel="stylesheet" href="/infinity/assets/verify.css">
  <script src="/infinity/assets/verify.js"></script>
</head>
<body>
<main id="app">
  <h1>The Infinity suite</h1>
  <p class="lede">Four Windows applications. Each one ships as a folder with its own copy of
  Node.js and a small launcher for every face, so there is no runtime to hunt for and no DLL to
  install beside it; the installer only unpacks that folder.</p>

  <section class="stack" id="products">
    <h2>Products</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="stack" id="latest">
    <h2>Latest releases</h2>
    <div id="releases"></div>
  </section>




</main>

<script src="./infinity/assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.nav('/');
  I.footer();

  var grid = document.getElementById('grid');
  I.PRODUCTS.forEach(function (p) {
    grid.appendChild(I.el('a', { class: 'product', href: './infinity/download/' + p.slug + '/' }, [
      I.el('div', { class: 'tag', text: p.short }),
      I.el('h3', { text: p.name }),
      I.el('p', { text: p.tagline })
    ]));
  });

  var host = document.getElementById('releases');
  I.loading(host, 'Reading releases…');

  Promise.all(I.PRODUCTS.map(function (p) {
    return I.releases(p.repo).then(function (list) { return { product: p, list: list || [] }; })
      .catch(function (e) { return { product: p, list: [], error: e.message }; });
  })).then(function (results) {
    I.clear(host);
    var table = I.el('table');
    table.appendChild(I.el('thead', null, [I.el('tr', null, [
      I.el('th', { text: 'Product' }),
      I.el('th', { text: 'Version' }),
      I.el('th', { text: 'Published' }),
      I.el('th', { class: 'num', text: 'Assets' }),
      I.el('th')
    ])]));
    var body = I.el('tbody');

    results.forEach(function (r) {
      var latest = r.list.filter(function (x) { return !x.draft; })[0];
      var row = I.el('tr');
      row.appendChild(I.el('td', null, [
        I.link('./infinity/download/' + r.product.slug + '/', r.product.name),
        I.el('div', { class: 'small faint', text: r.product.short })
      ]));
      if (!latest) {
        row.appendChild(I.el('td', { class: 'faint', text: '—' }));
        row.appendChild(I.el('td', { class: 'faint', text: r.error ? 'unavailable' : 'no releases' }));
        row.appendChild(I.el('td', { class: 'num faint', text: '0' }));
        row.appendChild(I.el('td', { class: 'small faint', text: 'nothing published yet' }));
      } else {
        row.appendChild(I.el('td', { class: 'mono', text: latest.tag_name || '' }));
        row.appendChild(I.el('td', { class: 'muted', text: I.fmtDate(latest.published_at) }));
        row.appendChild(I.el('td', { class: 'num', text: I.fmtCount((latest.assets || []).length) }));
        row.appendChild(I.el('td', null, [I.link(latest.html_url, 'release notes', 'small')]));
      }
      body.appendChild(row);
    });

    table.appendChild(body);
    host.appendChild(table);
    host.appendChild(I.el('p', { class: 'small faint', text:
      'Read live from GitHub. A product with no releases is shown as such rather than offered.' }));
  });
})();
</script>
</body>
</html>
