<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity.Inc — 无限套件</title>
<meta name="description" content="无限云盘（Infinity Cloud）、包管理器（InfinityPackageManager）与服务器（Infinity Server）：只需要 Windows 的 Windows 应用。">

<link rel="canonical" href="https://zssx-2026.github.io/cn/">
<link rel="alternate" hreflang="en" href="https://zssx-2026.github.io/">
<link rel="alternate" hreflang="zh-CN" href="https://zssx-2026.github.io/cn/">
<link rel="alternate" hreflang="x-default" href="https://zssx-2026.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Infinity.Inc">
<meta property="og:title" content="Infinity.Inc — 无限套件">
<meta property="og:description" content="无限云盘（Infinity Cloud）、包管理器（InfinityPackageManager）与服务器（Infinity Server）：只需要 Windows 的 Windows 应用。">
<meta property="og:url" content="https://zssx-2026.github.io/cn/">
<meta property="og:locale" content="zh_CN">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Infinity.Inc — 无限套件">
<meta name="twitter:description" content="无限云盘（Infinity Cloud）、包管理器（InfinityPackageManager）与服务器（Infinity Server）：只需要 Windows 的 Windows 应用。">
<script src="../assets/theme.js"></script>
<link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="/assets/verify.css">
  <script src="/assets/verify.js"></script>
</head>
<body>
<main id="app">
  <h1 data-t="suiteTitle"></h1>
  <p class="lede" data-t="suiteLede"></p>

  <section class="stack" id="products">
    <h2 data-t="products"></h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="stack" id="latest">
    <h2 data-t="latest"></h2>
    <div id="releases"></div>
  </section>

  <section class="stack">
    <h2 data-t="howItFits"></h2>
    <div class="grid">
      <div class="card">
        <h3 data-t="twoFaces"></h3>
        <p class="muted" data-t="twoFacesText"></p>
      </div>
      <div class="card">
        <h3 data-t="oneCatalogue"></h3>
        <p class="muted" data-t="oneCatalogueText"></p>
      </div>
      <div class="card">
        <h3 data-t="unverified"></h3>
        <p class="muted" data-t="unverifiedText"></p>
      </div>
    </div>
  </section>
</main>

<script src="../assets/sources.js"></script>
<script src="../assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.applyTranslations();
  I.nav('/');
  I.footer();

  var grid = document.getElementById('grid');
  I.PRODUCTS.forEach(function (p) {
    grid.appendChild(I.el('a', { class: 'product', href: I.page('/download/' + p.slug + '/') }, [
      I.el('div', { class: 'tag', text: p.short }),
      I.el('h3', { text: p.name }),
      I.el('p', { text: p.tagline })
    ]));
  });

  var host = document.getElementById('releases');
  I.loading(host, I.t('reading'));

  Promise.all(I.PRODUCTS.map(function (p) {
    return I.releases(p.repo).then(function (list) { return { product: p, list: list || [] }; })
      .catch(function (e) { return { product: p, list: [], error: e.message }; });
  })).then(function (results) {
    I.clear(host);
    var table = I.el('table');
    var head = I.el('tr');
    [I.t('product'), I.t('version'), I.t('published'), I.t('assets'), ''].forEach(function (text, i) {
      head.appendChild(I.el('th', { class: i === 3 ? 'num' : null, text: text }));
    });
    table.appendChild(I.el('thead', null, [head]));
    var body = I.el('tbody');

    results.forEach(function (r) {
      var latest = r.list.filter(function (x) { return !x.draft; })[0];
      var row = I.el('tr');
      row.appendChild(I.el('td', null, [
        I.link(I.page('/download/' + r.product.slug + '/'), r.product.name)
      ]));
      if (!latest) {
        row.appendChild(I.el('td', { class: 'faint', text: '—' }));
        row.appendChild(I.el('td', { class: 'faint', text: r.error ? I.t('unavailable') : I.t('noReleases') }));
        row.appendChild(I.el('td', { class: 'num faint', text: '0' }));
        row.appendChild(I.el('td'));
      } else {
        row.appendChild(I.el('td', { class: 'mono', text: latest.tag_name || '' }));
        row.appendChild(I.el('td', { class: 'muted', text: I.fmtDate(latest.published_at) }));
        row.appendChild(I.el('td', { class: 'num', text: I.fmtCount((latest.assets || []).length) }));
        row.appendChild(I.el('td', null, [I.link(latest.html_url, I.t('releaseNotes'), 'small')]));
      }
      body.appendChild(row);
    });

    table.appendChild(body);
    host.appendChild(table);
    /* The Chinese site reads Gitee, and the mirror is not published yet: the
     * table above is derived from the local snapshot. Say so, and offer the
     * GitHub page as a hand-clicked exit - the page never requests it. */
    var mirrorPending = I.lang() === 'zh' && I.sources && typeof I.sources.other === 'function' &&
      (results.some(function (r) { return r.error; }) ||
       results.every(function (r) { return !r.list.length; }));
    if (mirrorPending) {
      host.appendChild(I.el('p', { class: 'small faint' }, [
        I.t('giteePendingNote') + ' ',
        I.el('a', {
          class: 'github-exit',
          href: I.sources.other().web, target: '_blank', rel: 'noopener',
          text: I.t('giteePendingLink')
        })
      ]));
    }
    host.appendChild(I.el('p', { class: 'small faint', text: I.t('liveNote') }));
  });
})();
</script>
</body>
</html>
